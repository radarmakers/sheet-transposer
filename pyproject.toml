[project]
name = "sheet-transposer"
version = "0.1.0"
description = "Photo of sheet music -> key detection, transposition, engraved view"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "AGPL-3.0-or-later"
dependencies = [
    "homr[cpu]>=0.7.1",
    "music21>=10.5.2",
    "pillow>=12.3.0",
    "resvg-py>=0.5.0",
    "streamlit>=1.67.0",
    "verovio>=6.4.1",
]

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "albumentations>=2.0.8",
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
addopts = "-m 'not slow'"
markers = ["slow: runs real homr"]
testpaths = ["tests"]
